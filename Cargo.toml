[package]
name = "rask"
version = "0.1.0"
edition = "2024"
description = "Tasks planned in feature files, marked in Rust, checked by size and stubs, shown in rust-analyzer"
repository = "https://github.com/shinyobjectz/rask"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
serde_json = "1"

[profile.release]
debug = false
